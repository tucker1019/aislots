:root { --lobby-scale: 1; --lobby-inverse-scale: 1; --lobby-height: 100dvh; --content: 420px; touch-action: pan-x pan-y; }
body { min-width: 0; height: 100dvh; }

#root { width: 420px; max-width: none; height: var(--lobby-height); margin: 0; }
#lobby-overlays { position: fixed; top: 0; left: 50%; width: 420px; height: var(--lobby-height); transform: translateX(-50%); zoom: var(--lobby-scale); z-index: 1000; pointer-events: none; isolation: isolate; }
#lobby-overlays > :not(.ant-message):not(.ant-notification) { pointer-events: auto; }
/* Message lists span the viewport; only their visible notices may receive input. */
#lobby-overlays .ant-message, #lobby-overlays .ant-message-list-content { pointer-events: none; }
/* Drawer defaults to 100vw, which is scaled a second time inside the design canvas. */
#lobby-overlays .ant-drawer-content-wrapper { max-width: 100%; max-height: 100%; }

/* This portal is a physical viewport: Cocos handles its own scaling. */
body > .game-detail-shell { width: 420px; height: var(--lobby-height); transform: translateX(-50%); zoom: var(--lobby-scale); }
body > .game-detail-expanded { zoom: 1; transform: translateX(-50%); width: min(100%, 420px); height: 100dvh; }
.game-rank-order { flex: 1 1 0; display: flex; align-items: center; gap: 5px; min-width: 0; }
.game-platform-verified { margin-left: 0; flex-shrink: 0; }

:root { --lobby-safe-top: calc(env(safe-area-inset-top, 0px) * var(--lobby-inverse-scale)); --lobby-safe-bottom: calc(env(safe-area-inset-bottom, 0px) * var(--lobby-inverse-scale)); }
body > .game-detail-expanded { --lobby-safe-top: env(safe-area-inset-top, 0px); --lobby-safe-bottom: env(safe-area-inset-bottom, 0px); }

/* Browser font inflation must not override the shared design-coordinate scaling. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

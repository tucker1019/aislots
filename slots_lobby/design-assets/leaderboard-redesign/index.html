<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排行榜重设计</title><style>
:root{color-scheme:dark;--bg:#17152a;--panel:#24203d;--panel2:#2d2849;--line:#514a70;--text:#fff7f0;--muted:#b9b1c8;--coral:#ff8b72;--green:#8fd7b4;--gold:#ffd47d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#131124,#211a38);font-family:Inter,system-ui,sans-serif;color:var(--text)}.page{width:min(100%,740px);margin:auto;padding:20px 22px 40px}.title{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.title h1{font-size:27px;margin:0}.info{width:36px;height:36px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted);font-size:18px}.tabs{display:flex;gap:10px;margin-bottom:14px}.tab{padding:12px 18px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:16px;background:#211c37}.tab.active{border-color:var(--coral);color:var(--coral);background:#322442;font-weight:800}.metric{display:flex;gap:8px;margin-bottom:20px}.metric button{flex:1;padding:11px;border:1px solid var(--line);border-radius:11px;background:transparent;color:var(--muted);font-size:14px}.metric button.active{border-color:var(--coral);background:#34223d;color:var(--coral);font-weight:800}.row{display:grid;grid-template-columns:42px 46px minmax(0,1fr) 142px;align-items:center;gap:12px;min-height:102px;padding:14px 16px;border:1px solid #413b5d;border-radius:20px;background:linear-gradient(110deg,#27223f,#211d37);margin-bottom:12px}.row.top{border-color:var(--gold);background:linear-gradient(110deg,#362941,#26203b)}.rank{font-size:26px;font-weight:850;color:var(--muted);text-align:center}.top .rank{color:var(--gold)}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#51466e}.name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.self-name{color:var(--coral)}.uid,.game{display:block;color:var(--muted);font-size:12px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stats{text-align:right}.primary{font-size:25px;font-weight:900;line-height:1.15;color:var(--green)}.win{font-size:14px;color:var(--coral);font-weight:800;margin-top:4px}.reward{display:inline-flex;align-items:baseline;gap:4px;margin-top:6px;padding:5px 8px;border:1px solid color-mix(in srgb,var(--gold) 58%,transparent);border-radius:8px;background:color-mix(in srgb,var(--gold) 12%,transparent);color:var(--gold);font-size:12px;font-weight:800}.reward b{color:var(--gold);font-size:20px;line-height:1;font-weight:950}.claim{margin-top:7px;border:0;border-radius:8px;padding:6px 10px;background:var(--coral);color:#25172a;font-weight:850}.reward-line{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:6px;white-space:nowrap}.reward-line .reward{margin-top:0}.issued{color:var(--green);font-weight:800;font-size:12px;white-space:nowrap}.note{color:var(--muted);font-size:12px;margin:20px 2px 0}.legend{display:flex;gap:16px;color:var(--muted);font-size:12px;margin:4px 2px 15px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.d-green{background:var(--green)}.d-coral{background:var(--coral)}.win-value{display:none}.primary{display:block}body[data-mode="wins"] .multiplier-value{display:none}body[data-mode="wins"] .win-value{display:block;font-size:25px;font-weight:900;line-height:1.15;color:var(--coral)}@media(max-width:520px){.page{padding:16px 12px}.row{grid-template-columns:30px 38px minmax(0,1fr) 112px;gap:8px;padding:12px 10px}.avatar{width:38px;height:38px}.primary{font-size:20px}.win{font-size:12px}.name{font-size:14px}.uid,.game{font-size:11px}}
</style></head><body><main class="page"><header class="title"><h1>排行榜</h1><button class="info">i</button></header><nav class="tabs"><button class="tab">今日</button><button class="tab active">昨日最终榜单 <span style="color:var(--coral)">●</span></button></nav><div class="metric"><button class="active" data-mode="multiplier">最高倍数</button><button data-mode="wins">最大中奖</button></div><div class="legend"><span><i class="dot d-green"></i>榜单指标</span><span><i class="dot d-coral"></i>WIN 金额</span><span><i class="dot" style="background:var(--gold)"></i>排行榜奖金</span></div><section>
<article class="row top"><b class="rank">1</b><img class="avatar" src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=100&q=80"><div><div class="name">体验玩家</div><span class="uid">UID 10012927</span><span class="game">福運金龍</span></div><div class="stats"><div class="primary multiplier-value">300.00×</div><div class="win win-value">WIN Rp2.89k</div><div class="reward-line"><div class="reward">奖金 <b>Rp10k</b></div><span class="issued">✓ 已发放</span></div></div></article>
<article class="row"><b class="rank">2</b><img class="avatar" src="https://images.unsplash.com/photo-1560250097-0b93528c311a?w=100&q=80"><div><div class="name">体验玩家</div><span class="uid">UID 10012739</span><span class="game">Wild Bounty Showdown</span></div><div class="stats"><div class="primary multiplier-value">268.40×</div><div class="win win-value">WIN Rp5.00k</div><div class="reward-line"><div class="reward">奖金 <b>Rp5k</b></div><button class="claim">领取</button></div></div></article>
<article class="row"><b class="rank">3</b><img class="avatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80"><div><div class="name self-name">您</div><span class="uid">UID 10012896</span><span class="game">福運金龍</span></div><div class="stats"><div class="primary multiplier-value">175.60×</div><div class="win win-value">WIN Rp2.00k</div><div class="reward-line"><div class="reward">奖金 <b>Rp1k</b></div><span class="issued">✓ 已发放</span></div></div></article>
</section><p class="note">最高倍数榜按倍数排序；最大中奖榜按 WIN 金额排序。每条记录同时展示 WIN 金额与排行榜奖金。</p></main><script>
const buttons=[...document.querySelectorAll('[data-mode]')];
function setMode(mode){document.body.dataset.mode=mode;buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));}
buttons.forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
setMode('multiplier');
</script></body></html>

log_format sanitized '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name _;
    root /srv/www;
    index index.html;
    access_log /var/log/nginx/access.log sanitized;
    server_tokens off;
    add_header_inherit merge;
    client_max_body_size 1m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy 'clipboard-write=(self)' always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; }
    location ^~ /internal/ { return 404; }
    location = /healthz { access_log off; return 200 'OK\n'; }
    location ^~ /api/v1/ {
        proxy_pass http://game:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
    }
    location ^~ /api/ {
        proxy_pass http://lobby:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
    }
    location = /games/ag1 { return 301 /games/ag1/; }
    location /games/ag1/ { try_files $uri $uri/ =404; add_header Cache-Control no-cache; }
    location /assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}

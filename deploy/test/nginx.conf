log_format sanitized '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/43.160.234.135/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.160.234.135/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    root /srv/www;
    index index.html;
    access_log /var/log/nginx/access.log sanitized;
    server_tokens off;
    add_header_inherit merge;
    client_max_body_size 1m;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header Permissions-Policy 'clipboard-write=(self)' always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; }
    location ^~ /internal/ { return 404; }
    location = /healthz { access_log off; return 200 'OK\n'; }
    location ^~ /admin/api/ {
        proxy_pass http://admin:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
    }
    location = /ops { return 302 /ops/; }
    location /ops/ { try_files $uri $uri/ /ops/index.html; add_header Cache-Control no-store always; }
    location ^~ /api/v1/ {
        proxy_pass http://game:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
    }
    location ^~ /api/ {
        proxy_pass http://lobby:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control no-store always;
    }
    location = /games/ag1 { return 301 /games/ag1/; }
    location /games/ag1/ { try_files $uri $uri/ =404; add_header Cache-Control no-cache; }
    # 入口和 Cocos 启动配置必须重新校验，确保发布新版本后立即生效。
    location = /games/ag1/index.html { try_files $uri =404; add_header Cache-Control no-cache; }
    location = /games/ag1/index.js { try_files $uri =404; add_header Cache-Control no-cache; }
    location = /games/ag1/application.js { try_files $uri =404; add_header Cache-Control no-cache; }
    location = /games/ag1/style.css { try_files $uri =404; add_header Cache-Control no-cache; }
    location ^~ /games/ag1/src/ { try_files $uri =404; add_header Cache-Control no-cache; }

    location = /games/ag2 { return 301 /games/ag2/; }
    location /games/ag2/ { try_files $uri $uri/ =404; add_header Cache-Control no-cache; }
    # 入口和 Cocos 启动配置必须重新校验，确保发布新版本后立即生效。
    location = /games/ag2/index.html { try_files $uri =404; add_header Cache-Control no-cache; }
    location = /games/ag2/index.js { try_files $uri =404; add_header Cache-Control no-cache; }
    location = /games/ag2/application.js { try_files $uri =404; add_header Cache-Control no-cache; }
    location = /games/ag2/style.css { try_files $uri =404; add_header Cache-Control no-cache; }
    location ^~ /games/ag2/src/ { try_files $uri =404; add_header Cache-Control no-cache; }

    # 构建产物文件名带版本标识，允许浏览器长期缓存，避免重复下载。
    location ~* ^/games/(?:ag1|ag2)/.+\.(?:js|css|wasm|bin|json|png|jpg|jpeg|webp|svg|mp3|ogg|ttf|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location = /index.html { try_files $uri =404; add_header Cache-Control no-cache; }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log sanitized;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /srv/acme; }
    location / { return 308 https://$host$request_uri; }
}

services:
  postgres:
    image: postgres:18-alpine
    container_name: aislotspg-dev
    environment:
      POSTGRES_DB: aislots
      POSTGRES_USER: aislots
      POSTGRES_PASSWORD: aislots-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aislots -d aislots"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  pgdata:
    name: aislotspg-dev-data

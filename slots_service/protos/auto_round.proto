syntax = "proto3";
package aislots.internal.v1;
// POST /internal/auto-round; service Bearer credential only. Monetary units are cents.
// Same requestId + identity + wager resumes exactly one paid round and all of its free/cascade frames.
message AutoRoundRequest {
 string request_id = 1; int64 uid = 2; string game_id = 3;
 int64 bet = 4; int32 bet_level = 5; string country = 6; string currency = 7;
}
message AutoRoundReply { string status = 1; string request_id = 2; string bet_id = 3; }
// POST /internal/auto-bets; same service Bearer credential, returns configured legal policy.
message AutoBetsRequest { int64 uid=1; string game_id=2; string country=3; string currency=4; }

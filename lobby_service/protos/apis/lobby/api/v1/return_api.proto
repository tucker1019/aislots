syntax = "proto3";
package apis.lobby.api.v1;
option go_package = "apps/pb/apis/lobby/api/v1;v1";
import "google/api/annotations.proto";
// @Desc: 反水与亏损返还
service ReturnService {
 // @Desc: 日周月反水可领取金额与当前周期预估
 rpc RebateInfo(ReturnRequest) returns (RebateInfoReply) { option (google.api.http) = { get: "/api/activity/rebate/info" }; }
 // @Desc: 一次领取当天全部可领取的日周月反水
 rpc RebateClaim(ReturnRequest) returns (ReturnClaimReply) { option (google.api.http) = { post: "/api/activity/rebate/claim" body: "*" }; }
 // @Desc: 昨日亏损返还与今日预估
 rpc LoserReturnInfo(ReturnRequest) returns (LoserReturnInfoReply) { option (google.api.http) = { get: "/api/activity/loserreturn/info" }; }
 // @Desc: 单独领取昨日亏损返还
 rpc LoserReturnClaim(ReturnRequest) returns (ReturnClaimReply) { option (google.api.http) = { post: "/api/activity/loserreturn/claim" body: "*" }; }
}
message ReturnRequest {
 optional int64 uid = 1;
 optional string sid = 2;
 string activity_date = 3 [json_name="activityDate"];
}
message ReturnPeriod {
 string type = 1;
 string period_start = 2 [json_name="periodStart"];
 string period_end = 3 [json_name="periodEnd"];
 int64 valid_bet = 4 [json_name="validBet"];
 int64 bet_amount = 5 [json_name="betAmount"];
 int64 win_amount = 6 [json_name="winAmount"];
 int64 loss_amount = 7 [json_name="lossAmount"];
 int64 base_amount = 8 [json_name="baseAmount"];
 int32 rate_bps = 9 [json_name="rateBps"];
 int64 reward = 10;
 string status = 11;
 string available_at = 12 [json_name="availableAt"];
 string expires_at = 13 [json_name="expiresAt"];
}
message ReturnSection {
 ReturnPeriod claim = 1;
 ReturnPeriod preview = 2;
}
message RebateInfoReply {
 string activity_date = 1 [json_name="activityDate"];
 string timezone = 2;
 ReturnSection daily = 3;
 ReturnSection weekly = 4;
 ReturnSection monthly = 5;
 int64 claimable_total = 6 [json_name="claimableTotal"];
}
message LoserReturnInfoReply {
 string activity_date = 1 [json_name="activityDate"];
 string timezone = 2;
 ReturnSection daily = 3;
 int64 claimable_total = 4 [json_name="claimableTotal"];
}
message ReturnClaimReply {
 string claim_id = 1 [json_name="claimId"];
 string activity_date = 2 [json_name="activityDate"];
 int64 total_reward = 3 [json_name="totalReward"];
 int64 coins = 4;
 repeated ReturnPeriod items = 5;
}
